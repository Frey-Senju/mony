requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.5",
    "pyotp>=2.8.0",
    "qrcode[pil]>=7.4.0",
    "Pillow>=10.0.0",
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.0",
